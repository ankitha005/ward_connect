<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="gradRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="gradYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="gradGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#DC2626" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Smart Shield / Hexagon Frame (No Background Fill!) -->
  <path d="M 250 30 L 440 130 L 440 330 L 250 470 L 60 330 L 60 130 Z" fill="none" stroke="url(#gradGold)" stroke-width="14" stroke-linejoin="round" filter="url(#glow)" />
  <path d="M 250 50 L 420 140 L 420 320 L 250 450 L 80 320 L 80 140 Z" fill="none" stroke="url(#gradRed)" stroke-width="6" stroke-dasharray="15 8" opacity="0.8" />

  <!-- Digital City & Lotus Motif in Center -->
  <g transform="translate(0, -10)">
    <!-- Central Lotus Leaves (Golden & Crimson) -->
    <path d="M 250 140 C 290 200, 340 230, 360 310 C 320 330, 290 320, 250 340 C 210 320, 180 330, 140 310 C 160 230, 210 200, 250 140 Z" fill="url(#gradRed)" filter="url(#glow)" />
    <path d="M 250 170 C 275 210, 310 240, 320 300 C 290 310, 270 305, 250 320 C 230 305, 210 310, 180 300 C 190 240, 225 210, 250 170 Z" fill="url(#gradGold)" />
    <path d="M 250 200 C 265 230, 285 250, 290 290 C 275 295, 260 290, 250 300 C 240 290, 225 295, 210 290 C 215 250, 235 230, 250 200 Z" fill="#FFFFFF" opacity="0.9" />

    <!-- Digital Connection Nodes -->
    <circle cx="250" cy="110" r="14" fill="url(#gradGold)" filter="url(#glow)" />
    <circle cx="150" cy="170" r="10" fill="url(#gradRed)" />
    <circle cx="350" cy="170" r="10" fill="url(#gradRed)" />
    <circle cx="110" cy="270" r="10" fill="url(#gradGold)" />
    <circle cx="390" cy="270" r="10" fill="url(#gradGold)" />

    <!-- Connecting lines -->
    <line x1="250" y1="124" x2="250" y2="140" stroke="url(#gradGold)" stroke-width="4" />
    <line x1="158" y1="176" x2="190" y2="210" stroke="url(#gradRed)" stroke-width="3" />
    <line x1="342" y1="176" x2="310" y2="210" stroke="url(#gradRed)" stroke-width="3" />
  </g>

  <!-- Banner Text Arch or Emblem Base -->
  <path d="M 160 380 Q 250 420 340 380" fill="none" stroke="url(#gradGold)" stroke-width="8" stroke-linecap="round" />
  <circle cx="250" cy="400" r="8" fill="url(#gradRed)" />
</svg>
